<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #fff;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1f2937; color: #f3f4f6; }
      input { background: #374151; color: #f3f4f6; border-color: #4b5563; }
      .status-ok { color: #10b981; }
      .section-title { color: #a78bfa; }
      hr { border-color: #4b5563; }
    }
    h2 { margin: 0 0 12px; font-size: 1rem; }
    .info { font-size: 0.8rem; color: #666; margin-bottom: 12px; word-break: break-all; }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-obsidian {
      background: #7c3aed;
    }
    .btn-obsidian:hover {
      background: #6d28d9;
    }
    .status { margin-top: 10px; font-size: 0.85rem; text-align: center; min-height: 20px; }
    .status-ok { color: #10b981; }
    .status-err { color: #dc2626; }
    .folder-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 6px;
      background: #fff;
      color: #7c3aed;
      border: 1px solid #c4b5fd;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .folder-btn:hover { background: #f5f3ff; }
    .folder-btn.active {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
    }
    .folder-btn.active:hover { background: #6d28d9; }
    .folder-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .settings-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 0.8rem;
      color: #2563eb;
      text-decoration: none;
    }
    .section-title {
      font-size: 0.8rem;
      color: #7c3aed;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 12px 0;
    }
    #obsidian-section {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Save to Readflow</h2>
  <div class="info" id="page-info">Loading...</div>
  <button id="save-btn">Save Current Page</button>
  <div class="status" id="save-status"></div>

  <div id="obsidian-section">
    <hr>
    <div class="section-title">Obsidian</div>
    <div id="folder-buttons"></div>
    <div class="status" id="clip-status"></div>
  </div>

  <a class="settings-link" href="#" id="open-options">Settings</a>

  <script src="popup.js"></script>
</body>
</html>
