<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #fff;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1f2937; color: #f3f4f6; }
      input { background: #374151; color: #f3f4f6; border-color: #4b5563; }
      .hint { color: #9ca3af; }
      .folder-row button { color: #9ca3af; }
      .folder-row button:hover { color: #fca5a5; }
    }
    h2 { margin: 0 0 16px; font-size: 1.1rem; }
    h3 { margin: 20px 0 10px; font-size: 0.95rem; color: #7c3aed; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 16px 0; }
    @media (prefers-color-scheme: dark) {
      hr { border-color: #4b5563; }
      h3 { color: #a78bfa; }
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #666;
    }
    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    .checkbox-label input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    input {
      padding: 8px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    button {
      padding: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #1d4ed8; }
    .hint {
      font-size: 0.7rem;
      color: #999;
      margin-top: 2px;
    }
    .note {
      font-size: 0.75rem;
      color: #999;
      margin-top: 16px;
    }
    #save-btn {
      width: 100%;
      margin-top: 8px;
    }
    .folder-list {
      margin-bottom: 14px;
    }
    .folder-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .folder-row input {
      flex: 1;
      margin-bottom: 0;
    }
    .folder-row button {
      padding: 6px 10px;
      background: none;
      color: #999;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1;
      min-width: 28px;
    }
    .folder-row button:hover {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fecaca;
    }
    .folder-row button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    #add-folder-btn {
      width: 100%;
      background: none;
      color: #7c3aed;
      border: 1px dashed #c4b5fd;
      font-size: 0.85rem;
      padding: 8px;
    }
    #add-folder-btn:hover {
      background: #f5f3ff;
      border-color: #7c3aed;
    }
  </style>
</head>
<body>
  <h2>Readflow Settings</h2>
  <label>
    Server URL
    <input type="text" id="serverUrl" placeholder="https://your-server.com">
  </label>
  <label>
    API Key
    <input type="text" id="apiKey" placeholder="rf_...">
  </label>

  <hr>

  <h3>Obsidian Clipping</h3>
  <label class="checkbox-label">
    <input type="checkbox" id="obsidianEnabled">
    Enable clip to Obsidian
  </label>
  <label>
    Vault name
    <input type="text" id="obsidianVault" placeholder="MyVault">
    <span class="hint">Optional. If empty, clips to the currently active vault.</span>
  </label>
  <label>
    Folder paths
    <span class="hint">One folder per line. The last-used folder is highlighted by default.</span>
  </label>
  <div class="folder-list" id="folder-list"></div>
  <button id="add-folder-btn">+ Add folder</button>

  <button id="save-btn">Save</button>
  <div class="note">
    No Obsidian plugin required. Uses the built-in obsidian:// URI scheme.
  </div>

  <script src="options.js"></script>
</body>
</html>
