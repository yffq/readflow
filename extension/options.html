<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #fff;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1f2937; color: #f3f4f6; }
      input { background: #374151; color: #f3f4f6; border-color: #4b5563; }
      .hint { color: #9ca3af; }
    }
    h2 { margin: 0 0 16px; font-size: 1.1rem; }
    h3 { margin: 20px 0 10px; font-size: 0.95rem; color: #7c3aed; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 16px 0; }
    @media (prefers-color-scheme: dark) {
      hr { border-color: #4b5563; }
      h3 { color: #a78bfa; }
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #666;
    }
    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    .checkbox-label input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    input {
      padding: 8px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #1d4ed8; }
    .hint {
      font-size: 0.7rem;
      color: #999;
      margin-top: 2px;
    }
    .note {
      font-size: 0.75rem;
      color: #999;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h2>Readflow Settings</h2>
  <label>
    Server URL
    <input type="text" id="serverUrl" placeholder="https://your-server.com">
  </label>
  <label>
    API Key
    <input type="text" id="apiKey" placeholder="rf_...">
  </label>

  <hr>

  <h3>Obsidian Clipping</h3>
  <label class="checkbox-label">
    <input type="checkbox" id="obsidianEnabled">
    Enable clip to Obsidian
  </label>
  <label>
    Vault name
    <input type="text" id="obsidianVault" placeholder="MyVault">
    <span class="hint">Must match your Obsidian vault name exactly.</span>
  </label>
  <label>
    Folder path
    <input type="text" id="obsidianFolder" placeholder="Readflow">
    <span class="hint">Save articles under this folder within the vault. Default: Readflow</span>
  </label>

  <button id="save-btn">Save</button>
  <div class="note">
    No Obsidian plugin required. Uses the built-in obsidian:// URI scheme.
  </div>

  <script src="options.js"></script>
</body>
</html>
